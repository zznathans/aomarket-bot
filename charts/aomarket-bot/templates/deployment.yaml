apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.aomarketBot.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-serviceaccount
      containers:
        - name: aomarket-bot
          image: "{{ .Values.aomarketBot.image.repository }}:{{ .Values.aomarketBot.image.tag }}"
          ports:
            - containerPort: 8000
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8000"
            - name: AO_CHARACTER
              value: {{ .Values.aomarketBot.ao.character | quote }}
            - name: AO_CHAT_SERVER
              value: {{ .Values.aomarketBot.ao.chatServer | quote }}
            - name: AO_CHAT_PORT
              value: {{ .Values.aomarketBot.ao.chatPort | quote }}
            - name: AODB_API_URL
              value: {{ .Values.aomarketBot.aodbApiUrl | quote }}
            - name: GMI_API_URL
              value: {{ .Values.aomarketBot.gmiApiUrl | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.aomarketBot.logLevel | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: database-url
            - name: AO_LOGIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ao-login
            - name: AO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ao-password
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.aomarketBot.resources | nindent 12 }}
          # /readyz reports whether the AO chat bot thread has connected --
          # that stays false forever in API-only mode (no AO credentials
          # set), which would leave the pod permanently NotReady and the
          # Service would never route traffic to it. /healthz always
          # returns HTTP 200 (status is reflected in the JSON body, not the
          # HTTP status code) regardless of AO/DB state, so it's used for
          # both probes here.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
