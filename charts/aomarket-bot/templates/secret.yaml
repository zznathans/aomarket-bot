{{- if .Values.aomarketBot.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  {{- if eq .Values.aomarketBot.database.mode "url" }}
  database-url: {{ required "aomarketBot.secret.databaseUrl is required when database.mode is \"url\"" .Values.aomarketBot.secret.databaseUrl | quote }}
  {{- end }}
  ao-password: {{ .Values.aomarketBot.secret.aoPassword | quote }}
{{- end }}
