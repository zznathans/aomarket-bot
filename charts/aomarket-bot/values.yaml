aomarketBot:
  # -- Number of pod replicas. The bot thread holds a single AO chat
  # -- character session (non-daemon, one login) and migrations run
  # -- synchronously on every pod start (no separate migration Job) --
  # -- keep this at 1. Only safe to run more than one replica if AO
  # -- credentials below are left blank (API-only mode, no chat session).
  replicaCount: 1

  image:
    # -- Container image registry and repository for the aomarket-bot image.
    repository: ghcr.io/zznathans/aomarket-bot
    # -- Image tag to deploy. Prefer a real released semver -- :latest is
    # -- also published (@semantic-release-plus/docker's default channel
    # -- tag behavior) but always points at whatever released most
    # -- recently, not a version you can pin a deployment to.
    tag: "2.2.0"
    # -- Only "regular" is currently published -- release.yml's pipeline
    # -- does not build a docker-slim variant. Setting this to "slim"
    # -- renders a deployment pointing at a "<tag>-slim" tag that does not
    # -- exist. Left in place as a forward-compatible hook for if/when a
    # -- slim variant is reintroduced.
    variant: "regular"
  # -- List of image pull secret names to attach to the ServiceAccount.
  # -- Leave empty if the registry is public (ghcr.io/zznathans/aomarket-bot
  # -- is public today).
  imagePullSecrets: []

  # -- Resource requests and limits for the app container.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  service:
    # -- Port the Service listens on and forwards to the container's 8000.
    port: 80

  ao:
    # -- AO character name to log in as. Leave blank (along with login/
    # -- password below) to run API-only, with no live AO chat connection.
    character: ""
    # -- AO account login (email/username). Not treated as secret -- it's
    # -- an identifier, not a credential; only the password below is.
    login: ""
    # -- AO chat server hostname.
    chatServer: "chat.d1.funcom.com"
    # -- AO chat server port.
    chatPort: 7105
    # -- Player always treated as admin for in-game admin commands (e.g.
    # -- `!settings`) and API key purposes, regardless of MarketUser.is_admin
    # -- -- bootstraps the first admin. Leave blank to disable.
    ownerCharacter: ""

  # -- Base URL for the aodb-api item-lookup service.
  aodbApiUrl: "https://aodb.ao.yeetbox.net"
  # -- Base URL for the GMI live-order API.
  gmiApiUrl: "https://gmi.nadybot.org"
  # -- Log level (DEBUG/INFO/WARNING/ERROR).
  logLevel: "INFO"

  database:
    # -- "url" (default): DATABASE_URL comes from a Secret key `database-url`
    # -- (see createSecret/secret.databaseUrl/externalSecret.remoteKey.databaseUrl
    # -- below). "parts": for a Postgres operator (e.g. Zalando's
    # -- postgres-operator) that auto-generates a per-role Secret with
    # -- `username`/`password` keys but no full connection string -- host/
    # -- port/name are plain values here, and the username/password Secret
    # -- is referenced directly via existingSecret* below (no
    # -- createSecret/externalSecret involvement, since that Secret is
    # -- already managed by the operator, not by this chart).
    mode: url
    # -- Only used when mode is "parts".
    host: ""
    port: 5432
    name: ""
    # -- Only used when mode is "parts". Name of an existing Secret (e.g.
    # -- one a Postgres operator generated) with username/password keys.
    existingSecret: ""
    existingSecretUserKey: username
    existingSecretPasswordKey: password

  # -- Secret handling for DATABASE_URL (when database.mode is "url") and
  # -- the AO account password. true (default): renders a plain Secret from
  # -- the `secret.*` values below -- fine when those values are supplied
  # -- via `--set`/a gitignored local values file, not committed to git.
  # -- Set to false to instead render an ExternalSecret pulling from a
  # -- ClusterSecretStore (see `externalSecret.*` below), matching every
  # -- other app in this environment's ArgoCD setup.
  createSecret: true
  secret:
    # -- Full SQLAlchemy/asyncpg connection string, e.g.
    # -- postgresql+asyncpg://user:pass@host:5432/dbname. Required when
    # -- database.mode is "url" -- there is no usable default, this must
    # -- point at a real Postgres. Unused when database.mode is "parts".
    databaseUrl: ""
    # -- AO account password. Leave blank for API-only mode.
    aoPassword: ""

  # -- Only used when createSecret is false.
  externalSecret:
    secretStoreRef:
      name: gcp-clusterstore
      kind: ClusterSecretStore
    refreshInterval: 1h
    remoteKey:
      # -- Remote secret key (in the ClusterSecretStore) holding the DB
      # -- connection string. Unused when database.mode is "parts".
      databaseUrl: aomarket-bot-database-url
      # -- Remote secret key holding the AO account password.
      aoPassword: aomarket-bot-ao-password
    # -- Optional: property within each remote key above to extract, for a
    # -- ClusterSecretStore backend (e.g. GCP) where one remote key holds a
    # -- structured/multi-property secret rather than a single scalar value.
    # -- Leave blank to use the whole remote key value as-is (the default).
    remoteProperty:
      databaseUrl: ""
      aoPassword: ""

  # -- Raw Kubernetes objects to render alongside chart-managed resources.
  extraObjects: []
