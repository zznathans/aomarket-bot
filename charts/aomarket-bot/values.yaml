aomarketBot:
  # -- Number of pod replicas. The bot thread holds a single AO chat
  # -- character session (non-daemon, one login) and migrations run
  # -- synchronously on every pod start (no separate migration Job) --
  # -- keep this at 1. Only safe to run more than one replica if AO
  # -- credentials below are left blank (API-only mode, no chat session).
  replicaCount: 1

  image:
    # -- Container image registry and repository for the aomarket-bot image.
    repository: ghcr.io/zznathans/aomarket-bot
    # -- Image tag to deploy. Always a real released semver -- the release
    # -- pipeline never publishes a floating/latest tag.
    tag: "1.0.0"
    # -- "regular" (default) or "slim". Every release publishes both: the
    # -- regular image, and a docker-slim'd variant tagged "<tag>-slim".
    # -- WARNING: the slim variant is built by dynamically analyzing the
    # -- regular image's runtime behavior and stripping anything not
    # -- observed -- it's smaller, but can be less stable if a
    # -- rarely-exercised code path (an error branch, an optional
    # -- dependency) needs something that got stripped out. Only switch to
    # -- "slim" if you've specifically validated it for your workload.
    variant: "regular"
  # -- List of image pull secret names to attach to the ServiceAccount.
  # -- Leave empty if the registry is public (ghcr.io/zznathans/aomarket-bot
  # -- is public today).
  imagePullSecrets: []

  # -- Resource requests and limits for the app container.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  service:
    # -- Port the Service listens on and forwards to the container's 8000.
    port: 80

  ao:
    # -- AO character name to log in as. Leave blank (along with the
    # -- ao-login/ao-password secret values below) to run API-only, with no
    # -- live AO chat connection.
    character: ""
    # -- AO chat server hostname.
    chatServer: "chat.d1.funcom.com"
    # -- AO chat server port.
    chatPort: 7105

  # -- Base URL for the aodb-api item-lookup service.
  aodbApiUrl: "https://aodb-api.ao.yeetbox.net"
  # -- Base URL for the GMI live-order API.
  gmiApiUrl: "https://gmi.nadybot.org"
  # -- Log level (DEBUG/INFO/WARNING/ERROR).
  logLevel: "INFO"

  # -- Secret handling for DATABASE_URL and the AO account credentials.
  # -- true (default): renders a plain Secret from the `secret.*` values
  # -- below -- fine when those values are supplied via `--set`/a
  # -- gitignored local values file, not committed to git. Set to false to
  # -- instead render an ExternalSecret pulling from a ClusterSecretStore
  # -- (see `externalSecret.*` below), matching every other app in this
  # -- environment's ArgoCD setup.
  createSecret: true
  secret:
    # -- Full SQLAlchemy/asyncpg connection string, e.g.
    # -- postgresql+asyncpg://user:pass@host:5432/dbname. Required --
    # -- there is no usable default, this must point at a real Postgres.
    databaseUrl: ""
    # -- AO account login (email/username). Leave blank for API-only mode.
    aoLogin: ""
    # -- AO account password. Leave blank for API-only mode.
    aoPassword: ""

  # -- Only used when createSecret is false.
  externalSecret:
    secretStoreRef:
      name: gcp-clusterstore
      kind: ClusterSecretStore
    refreshInterval: 1h
    remoteKey:
      # -- Remote secret key (in the ClusterSecretStore) holding the DB
      # -- connection string.
      databaseUrl: aomarket-bot-database-url
      # -- Remote secret key holding the AO account login.
      aoLogin: aomarket-bot-ao-login
      # -- Remote secret key holding the AO account password.
      aoPassword: aomarket-bot-ao-password

  # -- Raw Kubernetes objects to render alongside chart-managed resources.
  extraObjects: []
