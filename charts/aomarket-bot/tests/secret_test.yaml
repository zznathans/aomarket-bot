suite: secret and external-secret
tests:
  - it: renders a plain Secret when createSecret is true (the default)
    templates:
      - secret.yaml
    set:
      aomarketBot.secret.databaseUrl: postgresql+asyncpg://user:pass@host:5432/db
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: stringData.database-url
          value: postgresql+asyncpg://user:pass@host:5432/db

  - it: renders an ExternalSecret instead when createSecret is false
    templates:
      - external-secret.yaml
    set:
      aomarketBot.createSecret: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: spec.target.name
          value: RELEASE-NAME-secret

  - it: fails when database.mode is url and secret.databaseUrl is not set
    templates:
      - secret.yaml
    asserts:
      - failedTemplate:
          errorMessage: "aomarketBot.secret.databaseUrl is required when database.mode is \"url\""
