suite: service-account
templates:
  - service-account.yaml
tests:
  - it: renders a single ServiceAccount with no pull secrets by default
    set:
      aomarketBot.secret.databaseUrl: postgresql+asyncpg://user:pass@host:5432/db
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - isNull:
          path: imagePullSecrets

  - it: adds imagePullSecrets when configured
    set:
      aomarketBot.secret.databaseUrl: postgresql+asyncpg://user:pass@host:5432/db
      aomarketBot.imagePullSecrets:
        - ghcr-pull-secret
    asserts:
      - equal:
          path: imagePullSecrets[0].name
          value: ghcr-pull-secret
