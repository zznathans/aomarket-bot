name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lockfile-check:
    name: requirements*.txt match pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Regenerate and diff against committed lockfiles
        run: |
          set -euo pipefail
          cp requirements.txt /tmp/requirements.txt.committed
          cp requirements-dev.txt /tmp/requirements-dev.txt.committed
          # Regenerated in place (same -o path as the header comment records)
          # so that comment matches exactly rather than showing a spurious
          # diff on the invocation path alone.
          uv pip compile pyproject.toml --universal --generate-hashes -o requirements.txt
          uv pip compile pyproject.toml --extra dev --universal --generate-hashes -o requirements-dev.txt
          diff -u /tmp/requirements.txt.committed requirements.txt
          diff -u /tmp/requirements-dev.txt.committed requirements-dev.txt

  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12","3.13","3.14","3.15.0-rc.1"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Two steps rather than one `pip install -e ".[dev]"`: --require-hashes
      # refuses to run at all if *any* requirement it's installing lacks a
      # hash, and the local package itself (an editable install of this
      # checkout, not a fetched artifact) has no meaningful hash to give it.
      # requirements-dev.txt pins/hashes everything that *is* fetched from
      # PyPI; regenerate it with `uv pip compile pyproject.toml --extra dev
      # --universal --generate-hashes -o requirements-dev.txt` after any
      # dependency change.
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps -e .

      - run: ruff check src tests

      # job.status reflects the outcome of every step run so far in this
      # job, including the ruff check above -- writing it here (as the
      # last step, if: always()) is what makes the badge below accurate
      # for a matrix leg that failed. Only main's status is worth
      # publishing (that's what the README badges track); PR runs skip
      # this so a PR's own in-progress state never overwrites it.
      - name: Write status badge
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p badge
          if [ "${{ job.status }}" = "success" ]; then
            echo '{"schemaVersion":1,"label":"lint","message":"passing","color":"brightgreen"}' > "badge/lint-${{ matrix.python-version }}.json"
          else
            echo '{"schemaVersion":1,"label":"lint","message":"failing","color":"red"}' > "badge/lint-${{ matrix.python-version }}.json"
          fi

      - name: Upload status badge
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badge-lint-${{ matrix.python-version }}
          path: badge/lint-${{ matrix.python-version }}.json

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12","3.13","3.14","3.15.0-rc.1"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aomarket
          POSTGRES_PASSWORD: aomarket
          POSTGRES_DB: aomarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aomarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aomarket:aomarket@localhost:5432/aomarket_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Two steps rather than one `pip install -e ".[dev]"`: --require-hashes
      # refuses to run at all if *any* requirement it's installing lacks a
      # hash, and the local package itself (an editable install of this
      # checkout, not a fetched artifact) has no meaningful hash to give it.
      # requirements-dev.txt pins/hashes everything that *is* fetched from
      # PyPI; regenerate it with `uv pip compile pyproject.toml --extra dev
      # --universal --generate-hashes -o requirements-dev.txt` after any
      # dependency change.
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps -e .

      # Tests build their schema directly from the SQLAlchemy models
      # (Base.metadata.create_all), bypassing Alembic entirely -- this step
      # is the only thing in CI that would catch a model change that was
      # never turned into a migration.
      - name: Verify Alembic migration applies cleanly
        env:
          DATABASE_URL: postgresql+asyncpg://aomarket:aomarket@localhost:5432/aomarket_test
        run: alembic upgrade head

      # Real Postgres integration tests (market service, repos, API routes,
      # the cross-thread bot bridge) run for real here rather than being
      # silently skipped -- requires_postgres only degrades to skip when no
      # Postgres is reachable, which shouldn't happen with the service above.
      - run: pytest -v

      # See the lint job's identical step for why job.status/if: always()/
      # github.event_name == 'push' here.
      - name: Write status badge
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p badge
          if [ "${{ job.status }}" = "success" ]; then
            echo '{"schemaVersion":1,"label":"tests","message":"passing","color":"brightgreen"}' > "badge/tests-${{ matrix.python-version }}.json"
          else
            echo '{"schemaVersion":1,"label":"tests","message":"failing","color":"red"}' > "badge/tests-${{ matrix.python-version }}.json"
          fi

      - name: Upload status badge
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badge-tests-${{ matrix.python-version }}
          path: badge/tests-${{ matrix.python-version }}.json

  # Aggregates every matrix leg's status badge (uploaded as an artifact
  # above, since a matrix job's `needs` output can't expose a per-leg
  # result) and pushes them all to gh-pages in one commit. Shares
  # pages.yml/publish-chart's concurrency group so none of the three ever
  # push to gh-pages at the same time.
  publish-badges:
    name: Publish CI status badges
    needs: [lint, test]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: badge-*
          path: badge-artifacts
          merge-multiple: true

      - name: Publish badges to gh-pages
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          mkdir -p /tmp/gh-pages/badges
          cp badge-artifacts/*.json /tmp/gh-pages/badges/
          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges
          if git diff --cached --quiet; then
            echo "no badge changes to publish"
            exit 0
          fi
          git commit -m "ci: update status badges [skip ci]"
          git push origin HEAD:gh-pages
