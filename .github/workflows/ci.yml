name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - run: ruff check src tests

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aomarket
          POSTGRES_PASSWORD: aomarket
          POSTGRES_DB: aomarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aomarket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aomarket:aomarket@localhost:5432/aomarket_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      # Tests build their schema directly from the SQLAlchemy models
      # (Base.metadata.create_all), bypassing Alembic entirely -- this step
      # is the only thing in CI that would catch a model change that was
      # never turned into a migration.
      - name: Verify Alembic migration applies cleanly
        env:
          DATABASE_URL: postgresql+asyncpg://aomarket:aomarket@localhost:5432/aomarket_test
        run: alembic upgrade head

      # Real Postgres integration tests (market service, repos, API routes,
      # the cross-thread bot bridge) run for real here rather than being
      # silently skipped -- requires_postgres only degrades to skip when no
      # Postgres is reachable, which shouldn't happen with the service above.
      - run: pytest -v
