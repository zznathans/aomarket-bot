name: Commit Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # This repo only allows --rebase merges (squash/merge-commit are
      # blocked by a ruleset), so every individual commit in a PR lands on
      # main with its own message intact -- semantic-release's
      # commit-analyzer reads all of them, not just a squashed PR title.
      # Lint the whole commit range, not just HEAD.
      - uses: wagoid/commitlint-github-action@6cf16efdf4da5277c791d335142c03a0bdf1766e # v6.2.1
