name: Pages

# Publishes the project's READMEs as a GitHub Pages site living on the
# same gh-pages branch chart-releaser-action already manages (see
# release.yml's publish-chart job). Deliberately its own workflow, not a
# step tacked onto publish-chart: that job only runs when
# semantic-release actually cuts a release, and docs-only commits
# (conventional-commits type "docs") never do -- so a docs-only change
# would otherwise never make it onto the site. The concurrency group
# below is shared with publish-chart so the two never push to gh-pages
# at the same time.
on:
  push:
    branches: [main]
    paths:
      - "**/README.md"
      - "docs/_config.yml"
      - "docs/CNAME"
      - ".github/workflows/pages.yml"

concurrency:
  group: gh-pages-publish

permissions:
  contents: write

jobs:
  publish-docs:
    name: Publish docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sync docs onto gh-pages
        run: |
          set -euo pipefail

          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages

          # index.yaml is chart-releaser's own state (the packaged charts
          # themselves are GitHub Release assets, not committed here) --
          # everything else on this branch up to now is a stray copy of
          # main from how gh-pages was originally bootstrapped, so it's
          # safe to clear and replace with the curated docs below.
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name index.yaml -exec rm -rf {} +

          find . -name README.md -not -path './.git/*' \
            -exec cp --parents {} /tmp/gh-pages/ \;
          cp docs/_config.yml /tmp/gh-pages/_config.yml
          cp docs/CNAME /tmp/gh-pages/CNAME

          cd /tmp/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no doc changes to publish"
            exit 0
          fi
          git commit -m "docs: publish site [skip ci]"
          git push origin HEAD:gh-pages
