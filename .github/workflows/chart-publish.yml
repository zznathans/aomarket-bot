name: Chart Publish

# Triggered by the version-bump commit release.yml's @semantic-release/git
# step pushes to main -- Chart.yaml/values.yaml already carry the release
# version by the time that commit lands, so this just packages and
# publishes whatever's currently on disk rather than needing to know the
# release tag separately. A plain push works here (no App-token trigger
# workaround needed, unlike a release:published-triggered workflow would)
# since that commit no longer carries [skip ci].
on:
  push:
    branches: [main]
    paths:
      - "charts/aomarket-bot/**"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          set -euo pipefail
          helm package charts/aomarket-bot -d /tmp/chart-out
          helm push /tmp/chart-out/aomarket-bot-*.tgz oci://ghcr.io/zznathans/aomarket-bot/charts
