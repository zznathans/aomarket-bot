name: Chart Publish

# Fires on release:published, same as docker-publish.yml -- release.yml's
# semantic-release step authenticates as the release App specifically so
# the release it creates fires triggers like this one (see
# docker-publish.yml's comment / the anti-recursion rule it links).
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: "3.17.0"

      # Bumped only in this runner's local checkout, never committed back
      # to main -- there's nothing to keep in sync afterward since the
      # next release re-derives this from the release tag again.
      - name: Sync chart version to the release version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          sed -i "s/^version:.*/version: ${version}/" charts/aomarket-bot/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${version}\"/" charts/aomarket-bot/Chart.yaml

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          set -euo pipefail
          helm package charts/aomarket-bot -d /tmp/chart-out
          helm push /tmp/chart-out/aomarket-bot-*.tgz oci://ghcr.io/zznathans/aomarket-bot/charts
