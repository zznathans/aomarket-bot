name: Registry Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"  # every hour

# GITHUB_TOKEN can't get delete:packages scope no matter what permissions
# are declared here - a hard GitHub limitation, not a config gap - so this
# needs a classic PAT (read:packages + delete:packages) stored as the
# PACKAGES_PAT secret. aodb's equivalent uses a GitHub App instead (already
# provisioned there for other bot-PR purposes); aomarket-bot has no such
# App, and standing one up just for this would be disproportionate - a PAT
# is the lighter-weight option here.
permissions: {}

jobs:
  clean:
    runs-on: ubuntu-latest
    name: Delete old test images
    steps:
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          # Literally "user", not the username - that's how this action
          # distinguishes personal accounts (different API endpoints) from
          # orgs, where `account:` would be the org name. zznathans/
          # aomarket-bot is a personal account, so this must be "user"
          # (using the literal username here calls the org-scoped API
          # against a personal account and fails to parse the response).
          account: user
          token: ${{ secrets.PACKAGES_PAT }}
          image-names: "aomarket-bot"
          dry-run: false
          # Higher than aodb's 30: this repo publishes 4 tags per release
          # (regular + slim, each as both the exact semver and the rolling
          # major.minor), not 1, so the same number here covers noticeably
          # less release history. 60 keeps roughly the last ~15 releases'
          # worth of tags around.
          keep-n-most-recent: 60
          # Required by the action with no default - set far in the past so
          # keep-n-most-recent above is the only thing that actually prunes;
          # age on its own isn't a signal we care about here.
          cut-off: 50y
