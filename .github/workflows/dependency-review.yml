name: Dependency Review

# pull_request only -- this action diffs the PR's base against its head to
# find newly-added dependencies, so it has nothing meaningful to compare
# on a plain branch push (no base ref to diff against). Not a required
# check, so a workflow-level path filter is safe: only worth running when
# a dependency manifest actually changed.
on:
  pull_request:
    paths:
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
          deny-licenses: LGPL-2.0
          comment-summary-in-pr: always
