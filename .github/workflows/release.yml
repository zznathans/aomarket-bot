name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Previously gated on the "CI" workflow's overall conclusion via
    # workflow_run -- but that conclusion is "failure" whenever ANY job
    # fails, including the informational-only Python versions in the test
    # matrix (see README's "Python version support" section: only 3.14 is
    # actually required to merge). Once the matrix grew past just the
    # required version, that made this trigger permanently misfire --
    # main's branch ruleset already requires the real gating checks
    # (Lint/Tests on 3.14, CodeQL, Scorecard, etc.) to pass before a PR
    # can merge at all, so by the time a push lands here those are already
    # known-good; no need to re-check a workflow_run's conclusion.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main

      - uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4
        id: semantic
        with:
          semantic_version: 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishing lives in the same workflow run as the release itself, rather
  # than docker.yml listening for the resulting tag push, specifically to
  # avoid needing a PAT: a tag/release created by the default GITHUB_TOKEN
  # does not trigger other workflows (GitHub's anti-recursion protection),
  # so a separate tag-triggered workflow would never fire off this step.
  # docker/login-action authenticating to ghcr.io with GITHUB_TOKEN is a
  # different, unrelated concern and works fine either way.
  publish-image:
    name: Build, Scan, and Push Release Image
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.git_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/zznathans/aomarket-bot
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.git_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.git_tag }}

      # load: true in addition to push: true so the just-pushed image is
      # also available in the runner's local docker daemon -- needed below
      # as docker-slim's input (it operates on a local image, not a
      # registry ref) and to push the slim variant afterward.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/zznathans/aomarket-bot@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy scan results to the Security tab
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: trivy-regular

      # Published alongside the regular image under a `-slim` tag suffix --
      # see charts/aomarket-bot's `image.variant` value for how a
      # deployment opts into it. WARNING (also called out in the chart):
      # docker-slim strips anything not observed during its dynamic
      # analysis pass, so a rarely-exercised code path can be less stable
      # in the slim variant than the regular one.
      - name: Build slimmed image
        uses: kitabisa/docker-slim-action@6a9a64eaf0c08b1251c148514dd70be1495bff12 # v1.2.0
        env:
          DSLIM_HTTP_PROBE: false
        with:
          target: ghcr.io/zznathans/aomarket-bot:${{ needs.release.outputs.version }}
          tag: slim

      - name: Tag and push slimmed image
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          MAJOR_MINOR="${VERSION%.*}"
          docker tag ghcr.io/zznathans/aomarket-bot:slim "ghcr.io/zznathans/aomarket-bot:${VERSION}-slim"
          docker tag ghcr.io/zznathans/aomarket-bot:slim "ghcr.io/zznathans/aomarket-bot:${MAJOR_MINOR}-slim"
          docker push "ghcr.io/zznathans/aomarket-bot:${VERSION}-slim"
          docker push "ghcr.io/zznathans/aomarket-bot:${MAJOR_MINOR}-slim"

      - name: Scan slimmed image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/zznathans/aomarket-bot:${{ needs.release.outputs.version }}-slim
          format: sarif
          output: trivy-results-slim.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy scan results (slim image) to the Security tab
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        if: always() && hashFiles('trivy-results-slim.sarif') != ''
        with:
          sarif_file: trivy-results-slim.sarif
          category: trivy-slim

  # Same "publish from inside the release workflow run" reasoning as
  # publish-image above: chart-releaser needs to push to gh-pages, and a
  # tag/release made by the default GITHUB_TOKEN wouldn't trigger a
  # separately-tag-triggered workflow anyway. gh-pages has no branch
  # protection (only main does), so the default token's contents: write
  # permission is all this needs -- no PAT.
  publish-chart:
    name: Release Helm Chart
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    # Shared with pages.yml's publish-docs job -- both push to gh-pages,
    # this serializes them instead of letting them race.
    concurrency:
      group: gh-pages-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.git_tag }}
          fetch-depth: 0

      # Bumped only in this runner's local checkout, never committed back
      # to main (which would hit the same branch-protection rule that
      # broke @semantic-release/git) -- chart-releaser packages whatever
      # Chart.yaml looks like right here and pushes the result to
      # gh-pages, a separate unprotected ref.
      - name: Sync chart version to the release version
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION}/" charts/aomarket-bot/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" charts/aomarket-bot/Chart.yaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@a0d2dc62c5e491af8ef6ba64a2e02bcf3fb33aa1 # v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
