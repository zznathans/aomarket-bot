name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Run semantic-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      # Mints a short-lived installation token for the aomarket-bot-release
      # App instead of using secrets.GITHUB_TOKEN -- a release/tag created
      # with the default token never fires other workflows' release:
      # published listeners (GitHub's anti-recursion rule), which is
      # exactly what chart-publish.yml needs to trigger. See
      # https://github.com/semantic-release/semantic-release/discussions/1906.
      - name: Generate a token for the release App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Also required for the App token to actually be used for git
          # operations rather than the default token checkout would
          # otherwise wire in -- same "persist-credentials: false" fix
          # documented in the discussion linked above.
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # @semantic-release-plus/docker (see .releaserc.json) doesn't build
      # the image itself -- it expects an already-built, locally-tagged
      # image and re-tags/pushes it once the release version is known.
      - name: Build image
        run: docker build -t aomarket-bot:release .

      # skipLogin: true in .releaserc.json's docker plugin config, so
      # login happens here instead, the same way docker.yml's old
      # standalone publish step did it.
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release-plus/docker
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
