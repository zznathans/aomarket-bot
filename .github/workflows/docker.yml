name: Docker

# Build-only verification -- never pushes an image. Actual publishing
# happens from release.yml once that job exists. Same trigger/dedup shape
# as ci.yml: push to any branch except main, and pull_request; the
# check-pr job skips the push-triggered run once a PR is open on that
# branch, since pull_request already covers the same commit.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-pr:
    name: Check for open PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      has_open_pr: ${{ steps.check.outputs.has_open_pr }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "${{ github.repository }}" --head "${{ github.ref_name }}" --state open --json number --jq 'length')
          echo "has_open_pr=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (verification only)
    needs: check-pr
    if: always() && (github.event_name == 'pull_request' || needs.check-pr.outputs.has_open_pr == 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          tags: aomarket-bot:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
