name: Docker

on:
  # Build-and-scan verification only -- never publishes. Actual publishing
  # to ghcr.io happens from release.yml's publish-image job, in the same
  # workflow run as the semantic-release step that cuts the version tag
  # (see the comment there for why it's not a separate tag-triggered
  # workflow). There's no "latest floating on main" image.
  pull_request:
    paths:
      - .github/workflows/**
      - Dockerfile
      - .dockerignore
      - docker-entrypoint.sh
      - src/**
      - pyproject.toml
      - migrations/**
      - alembic.ini

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Scan (verification only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: aomarket-bot:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `tag` is a bare tag, not repo:tag -- the action tags its output as
      # `<target's repo>:<tag>` itself, so a repo:tag string here produces
      # an invalid double-colon reference (aomarket-bot:aomarket-bot-slim:pr-N).
      - uses: kitabisa/docker-slim-action@6a9a64eaf0c08b1251c148514dd70be1495bff12 # v1.2.0
        env:
          DSLIM_HTTP_PROBE: false
        with:
          target: aomarket-bot:pr-${{ github.event.pull_request.number }}
          tag: "pr-${{ github.event.pull_request.number }}-slim"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: aomarket-bot:pr-${{ github.event.pull_request.number }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy scan results to the Security tab
        uses: github/codeql-action/upload-sarif@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
