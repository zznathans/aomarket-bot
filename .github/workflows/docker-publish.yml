name: Docker Publish

# Fires on release:published rather than being chained onto release.yml's
# own job. release.yml's semantic-release step authenticates as the
# release App (not secrets.GITHUB_TOKEN) specifically so the release it
# creates fires this trigger -- GitHub's anti-recursion rule means an
# event created by the default token never would have.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/zznathans/aomarket-bot
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}

      # cache-from pulls whatever layers docker.yml's build-verification
      # job (or a prior publish) already left in the GHA cache for this
      # ref, so this is usually a re-push of already-built layers rather
      # than a from-scratch build -- falls back to a normal build for
      # anything not already cached.
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
