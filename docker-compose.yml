services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aomarket
      POSTGRES_PASSWORD: aomarket
      POSTGRES_DB: aomarket
    ports:
      - "55432:5432"
    volumes:
      - aomarket-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aomarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://aomarket:aomarket@postgres:5432/aomarket
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aomarket-pgdata:
